[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapaz"
version = "0.1.0"
description = "La Paz Proactiva: alerta temprana de pozos, demanda y tandeo optimizado para La Paz, BCS"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
